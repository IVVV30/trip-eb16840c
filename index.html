<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>沖繩 6 天</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Outfit:wght@400;500;600&display=swap">
<style>/* layout: guidebook — cover spread, overview grid, sticky day chips, per-day timeline with 5:3 photos on the right (stacked on phones) */
:root{
  --bg:#f6f8f8; --paper:#ffffff; --ink:#1d2a2e; --ink-2:#56676c; --ink-3:#8a9a9e; --line:#e2e9ea; --soft:#eef3f4;
  --warn:#d6362f; --warn-bg:#fdeceb; --star:#e39b12; --star-bg:#fdf3df;
  --c1:#e2457a; --c2:#14a3b0; --c3:#3a9a48; --c4:#8457e6; --c5:#2f78db; --c6:#ec8420;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-num:"Outfit","Noto Sans TC",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1517; --paper:#172023; --ink:#e7eef0; --ink-2:#a9b8bc; --ink-3:#7d8d91; --line:#26343a; --soft:#1e2a2e;
  --warn:#ff6b62; --warn-bg:#3a1c1b; --star:#f2b84a; --star-bg:#3a2e14;
  --c1:#f0709a; --c2:#3cc4cf; --c3:#62bf6f; --c4:#a687f2; --c5:#62a0ee; --c6:#f4a254; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1517; --paper:#172023; --ink:#e7eef0; --ink-2:#a9b8bc; --ink-3:#7d8d91; --line:#26343a; --soft:#1e2a2e;
  --warn:#ff6b62; --warn-bg:#3a1c1b; --star:#f2b84a; --star-bg:#3a2e14;
  --c1:#f0709a; --c2:#3cc4cf; --c3:#62bf6f; --c4:#a687f2; --c5:#62a0ee; --c6:#f4a254; color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.65;-webkit-text-size-adjust:100%}
a{color:inherit}
img{max-width:100%;display:block}
.d1{--dc:var(--c1)} .d2{--dc:var(--c2)} .d3{--dc:var(--c3)} .d4{--dc:var(--c4)} .d5{--dc:var(--c5)} .d6{--dc:var(--c6)}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:20px 48px}
.ic,.ic-s,.ic-l{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic-s{width:15px;height:15px}.ic-l{width:28px;height:28px}

/* photos */
.photo{margin:0;min-width:0}
.photo a{position:relative;display:block;aspect-ratio:5/3;max-width:100%;border-radius:10px;overflow:hidden;background:var(--soft)}
.photo img{width:100%;height:100%;object-fit:cover}
.ph-fallback{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--ink-3);font-size:13px;text-align:center;padding:8px}
.photo.noimg img{display:none}.photo.noimg .ph-fallback{display:flex}
.photo figcaption{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:6px;font-size:12px;color:var(--ink-3)}
.photo .src{margin-left:auto}
.area{font-size:11px;padding:1px 6px;border-radius:4px;background:var(--soft);color:var(--ink-2)}

/* cover */
.cover{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:32px;align-items:center;background:var(--paper);border-radius:16px;padding:20px}
.kicker{margin:0;font-family:var(--f-num);letter-spacing:.3em;font-size:12px;color:var(--ink-3)}
.cover h1{margin:.1em 0 .15em;font-size:clamp(34px,6vw,54px);line-height:1.15;font-weight:700;letter-spacing:.04em;text-wrap:balance}
.dates{margin:0;font-family:var(--f-num);font-size:17px;font-weight:500}
.sum{margin:.4em 0 0;color:var(--ink-2)}
.flights{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.flights span{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:5px 10px;border-radius:999px;background:var(--soft);color:var(--ink-2);font-variant-numeric:tabular-nums}

/* overview */
.overview{margin-top:28px}
.overview h2,.day{scroll-margin-top:64px}
.overview h2{display:flex;align-items:baseline;gap:10px;font-size:20px;margin:0 0 12px;letter-spacing:.1em}
.overview h2 small{font-family:var(--f-num);font-size:12px;letter-spacing:.3em;color:var(--ink-3);font-weight:400;text-transform:uppercase}
.ov-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.ov{display:flex;gap:12px;text-decoration:none;background:var(--paper);border-radius:12px;padding:14px;border:1px solid var(--line);transition:border-color .15s}
.ov:hover,.ov:focus-visible{border-color:var(--dc);outline:none}
.ov-n{font-family:var(--f-num);font-size:38px;line-height:1;font-weight:600;color:var(--dc);min-width:26px}
.ov-t{display:flex;flex-direction:column;min-width:0}
.ov-t b{font-family:var(--f-num);font-weight:500}
.ov-t small{color:var(--ink-2);font-size:13px}
.ov-t em{font-style:normal;font-size:13px;color:var(--ink-3);margin-top:4px}

/* sticky day nav */
.daynav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;margin:28px -16px 0;padding:10px 16px;background:var(--bg);border-bottom:1px solid var(--line)}
.daynav-in{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.daynav-in::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:baseline;gap:6px;text-decoration:none;font-family:var(--f-num);font-weight:500;font-size:14px;padding:6px 12px;border-radius:999px;background:var(--paper);border:1px solid var(--line);color:var(--dc)}
.chip small{color:var(--ink-3);font-weight:400;font-size:12px}
.chip:hover,.chip:focus-visible{border-color:var(--dc);outline:none}

/* day */
.day{margin-top:28px;background:var(--paper);border-radius:16px;padding:22px 22px 8px}
.day-head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px 20px;padding-bottom:14px;border-bottom:2px solid var(--dc)}
.day-no{color:var(--dc);font-size:24px;font-weight:700;letter-spacing:.06em;line-height:1}
.day-no b{font-family:var(--f-num);font-size:56px;font-weight:600;vertical-align:-4px;margin:0 2px}
.day-info{min-width:0}
.day-info p{margin:0}
.date{font-family:var(--f-num);font-size:18px;font-weight:500}
.route{color:var(--ink-2)}
.stay{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-3)}

/* timeline */
.timeline{list-style:none;margin:0;padding:0}
.stop{display:grid;grid-template-columns:104px minmax(0,1fr);gap:4px 18px;padding:16px 0;border-bottom:1px solid var(--line);position:relative}
.stop:last-child{border-bottom:0}
.stop.has-photo{grid-template-columns:104px minmax(0,1fr) minmax(0,300px)}
.time{font-family:var(--f-num);font-weight:500;color:var(--dc);font-variant-numeric:tabular-nums;font-size:15px;line-height:1.5;padding-top:1px}
.body{min-width:0}
.head{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.topic{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--ink-2);background:var(--soft);padding:1px 8px;border-radius:4px}
.stop h3{margin:4px 0 6px;font-size:16.5px;font-weight:500;line-height:1.45;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--ink-2)}
.trans,.maplink{display:inline-flex;align-items:center;gap:5px}
.maplink{color:var(--dc);text-decoration:none}
.maplink:hover{text-decoration:underline}
.remark{margin:8px 0 0;font-size:13.5px;color:var(--ink-2);line-height:1.7}
.stop:not(.has-photo) h3{font-size:15px}
.stop:not(.has-photo){padding:12px 0}

/* highlight states */
.is-star .topic{background:var(--star-bg);color:var(--star);font-weight:500}
.warn{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;color:#fff;background:var(--warn);padding:2px 9px;border-radius:4px}
.is-alert{background:var(--warn-bg);margin:0 -12px;padding-left:12px;padding-right:12px;border-radius:10px;border-bottom-color:transparent}
.is-alert h3{color:var(--warn)}

.foot{margin-top:28px;font-size:12.5px;color:var(--ink-3);line-height:1.7}

@media (max-width:860px){
  .ov-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stop.has-photo{grid-template-columns:96px minmax(0,1fr) minmax(0,220px)}
}
@media (max-width:640px){
  body{font-size:14.5px}
  .wrap{padding-block:12px 40px}
  .cover{grid-template-columns:minmax(0,1fr);gap:16px;padding:12px}
  .ov-grid{grid-template-columns:minmax(0,1fr)}
  .day{padding:16px 14px 4px;border-radius:14px}
  .day-no b{font-size:46px}
  .stop,.stop.has-photo{grid-template-columns:minmax(0,1fr);gap:4px}
  .stop.has-photo .photo{order:-1;margin-bottom:8px}
  .time{font-size:14px}
  .is-alert{margin:0 -8px;padding-left:8px;padding-right:8px}
}
</style>
<style>
.lock{min-height:80vh;display:flex;align-items:center;justify-content:center}
.lock form{background:var(--paper);border-radius:16px;padding:28px 24px;width:100%;max-width:340px;display:flex;flex-direction:column;gap:12px;text-align:center}
.lock h1{margin:0;font-size:28px;letter-spacing:.04em}
.lock p{margin:0;color:var(--ink-2);font-size:14px}
.lock input{font:inherit;font-size:18px;text-align:center;letter-spacing:.2em;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.lock input:focus{outline:2px solid var(--c2);outline-offset:1px}
.lock button{font:inherit;font-weight:500;padding:10px;border:0;border-radius:10px;background:var(--c2);color:#fff;cursor:pointer}
.lock .err{color:var(--warn);font-size:13px;min-height:1.2em}
.lock label{display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;color:var(--ink-2)}
</style>
</head>
<body>
<div class="wrap" id="app">
<div class="lock"><form id="f">
<p class="kicker">OKINAWA · 2026</p>
<h1>沖繩 6 天</h1>
<p>請輸入密碼查看行程</p>
<input id="pw" type="password" inputmode="numeric" autocomplete="current-password" aria-label="密碼" autofocus>
<label><input id="rem" type="checkbox" checked style="width:auto">在這台裝置記住密碼</label>
<button type="submit">開啟行程</button>
<div class="err" id="err" role="alert"></div>
</form></div>
</div>

async function open_(pw){
  const k0=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u(D.s),iterations:D.n,hash:"SHA-256"},k0,{name:"AES-GCM",length:256},false,["decrypt"]);

const KEY="okinawa-pw";
